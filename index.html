<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKrach — Visual Skript Editor for Minecraft</title>
<style>
  :root {
    --bg-main: #f9f9f9;
    --bg-panel: #ffffff;
    --bg-workspace: #f0f4f8;
    --bg-code: #161922;
    --border: #d9e2ec;
    --accent: #4c97ff;
    --accent-dark: #3373cc;
    --green: #0fbd8c;
    --purple: #9966ff;
    --text: #2c3e50;
    --text-muted: #627d98;
  }
  * { box-sizing: border-box; user-select: none; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg-main); color: var(--text); overflow: hidden; }

  /* TOP NAVBAR */
  header {
    height: 54px; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.14); z-index: 20; gap: 10px;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; letter-spacing: -0.5px; white-space: nowrap; }
  .brand-badge { background: #ffab19; color: #1e1e1e; font-size: 11px; padding: 2px 7px; border-radius: 99px; font-weight: 800; }
  .top-controls { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .title-input {
    background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.45);
    color: #fff; padding: 6px 11px; border-radius: 6px; font-weight: 600; font-size: 13px; width: 175px;
    user-select: text;
  }
  .title-input::placeholder { color: rgba(255,255,255,0.82); }
  .title-input:focus { outline: none; background: rgba(255,255,255,0.32); border-color: #fff; }

  .lang-select {
    background: rgba(0,0,0,0.22); color: #fff; border: 1px solid rgba(255,255,255,0.4);
    border-radius: 6px; padding: 6px 8px; font-size: 12.5px; font-weight: 700; cursor: pointer; outline: none;
  }
  .lang-select option { color: #1f2933; background: #fff; }

  .btn {
    border: none; border-radius: 6px; padding: 7px 12px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: 0.14s; white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn-white { background: #fff; color: var(--accent-dark); }
  .btn-white:hover { background: #eef6ff; }
  .btn-green { background: var(--green); color: #fff; }
  .btn-green:hover { filter: brightness(1.06); }
  .btn-orange { background: #ffab19; color: #1f2933; }
  .btn-orange:hover { filter: brightness(1.05); }
  .btn-purple { background: #9966ff; color: #fff; }
  .btn-purple:hover { filter: brightness(1.07); }
  .btn-ghost { background: rgba(255,255,255,0.18); color: #fff; }
  .btn-ghost:hover { background: rgba(255,255,255,0.28); }

  /* MAIN LAYOUT */
  main { flex: 1; display: flex; overflow: hidden; }

  /* CATEGORIES SIDEBAR */
  .categories {
    width: 82px; background: var(--bg-panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; padding-top: 10px; gap: 6px;
  }
  .cat-item {
    width: 72px; padding: 8px 4px; border-radius: 8px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700; color: var(--text-muted); text-align: center;
  }
  .cat-item:hover, .cat-item.active { background: #eef4fa; color: var(--accent-dark); }
  .cat-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.12); }

  /* BLOCK PALETTE */
  .palette {
    width: 285px; background: var(--bg-panel); border-right: 1px solid var(--border);
    padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 9px;
  }
  .palette-title { font-size: 11.5px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px; }

  /* WORKSPACE */
  .workspace-wrap { flex: 1; position: relative; background: var(--bg-workspace); overflow: hidden; display: flex; flex-direction: column; }
  .workspace-bar {
    height: 36px; background: #e4ecf4; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 12px; color: var(--text-muted);
  }
  #workspace {
    flex: 1; position: relative; overflow: auto; padding: 20px;
    background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
    background-size: 20px 20px;
  }

  /* SCRATCH-STYLE BLOCKS */
  .block {
    display: inline-flex; flex-direction: column; align-items: flex-start;
    color: #fff; font-weight: 600; font-size: 12.5px; border-radius: 6px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.22); cursor: pointer; position: relative;
    margin-bottom: 4px; max-width: 100%; transition: transform 0.08s;
  }
  .palette .block:hover { transform: translateX(3px); }
  .block-row {
    display: flex; align-items: center; flex-wrap: wrap; gap: 5px;
    padding: 6px 10px; min-height: 33px;
  }
  .block.hat { border-radius: 16px 16px 6px 6px; padding-top: 3px; }
  .c-inner {
    margin-left: 16px; padding: 6px 8px; min-height: 34px; min-width: 215px;
    background: rgba(0,0,0,0.14); border-left: 3px solid rgba(255,255,255,0.4);
    border-radius: 4px 0 0 4px; display: flex; flex-direction: column; gap: 4px;
  }
  .c-inner.active-target { outline: 2px dashed #fff; background: rgba(255,255,255,0.16); }
  .c-footer { padding: 3px 10px; font-size: 11px; opacity: 0.85; }

  .block input, .block select {
    background: #fff; color: #1f2933; border: none; border-radius: 99px;
    padding: 2px 8px; font-size: 12px; font-weight: 700; outline: none;
    user-select: text; min-width: 40px;
  }
  .block input.num { width: 46px; text-align: center; }
  .block input.wide { min-width: 125px; }

  .c-events { background: #ffbf00; color: #2b2100; }
  .c-player { background: #4c97ff; }
  .c-gui    { background: #9966ff; }
  .c-world  { background: #59c059; }
  .c-ctrl   { background: #ffab19; color: #2b1d00; }
  .c-vars   { background: #ff8c1a; }

  .stack-group {
    position: relative; display: inline-flex; flex-direction: column; align-items: flex-start;
    padding: 10px; border-radius: 10px; margin: 0 14px 14px 0; vertical-align: top;
    background: rgba(255,255,255,0.55); border: 1.5px solid #d5e0ec;
  }
  .stack-group.selected { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(76,151,255,0.2); background: #fff; }
  .stack-header {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px;
  }
  .mini-btn {
    border: none; background: #e2e8f0; color: #334155; border-radius: 4px;
    padding: 2px 6px; font-size: 11px; font-weight: 700; cursor: pointer;
  }
  .mini-btn:hover { background: #cbd5e1; }
  .mini-btn.del { background: #fee2e2; color: #b91c1c; }

  /* RIGHT PANEL: CODE + SIMULATOR */
  .right-panel {
    width: 420px; background: var(--bg-panel); border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .tabs { display: flex; border-bottom: 1px solid var(--border); background: #f4f7fa; }
  .tab {
    flex: 1; padding: 10px; text-align: center; font-size: 12.5px; font-weight: 700;
    cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--accent-dark); border-bottom-color: var(--accent); background: #fff; }

  .code-box {
    flex: 1; background: var(--bg-code); color: #e2e8f0; padding: 14px;
    font-family: 'Fira Code', Consolas, monospace; font-size: 12.5px; line-height: 1.55;
    overflow: auto; white-space: pre; user-select: text;
  }
  .code-actions {
    padding: 10px; background: #1e2330; display: flex; gap: 8px; border-top: 1px solid #2d3446;
  }

  /* MINI MINECRAFT SIMULATOR */
  .sim-box { flex: 1; display: none; flex-direction: column; background: #181c24; color: #fff; overflow: hidden; }
  .sim-screen {
    flex: 1; padding: 10px; display: flex; flex-direction: column; justify-content: space-between;
    background: linear-gradient(180deg, #5ba4fc 0%, #99c8ff 56%, #5aa13c 56%, #47822e 100%);
    position: relative; overflow: hidden;
  }
  .sim-hud {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
    background: rgba(0,0,0,0.65); padding: 6px 10px; border-radius: 6px; font-size: 11.5px; font-weight: 700;
  }
  .sim-triggers { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; z-index: 2; }

  /* INTERACTIVE MINECRAFT CHEST GUI OVERLAY */
  .mc-chest-overlay {
    display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.68);
    align-items: center; justify-content: center; z-index: 15; padding: 12px;
  }
  .mc-chest {
    background: #c6c6c6; border: 3px solid #373737; box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 #555;
    border-radius: 4px; padding: 10px; color: #3f3f3f; width: 100%; max-width: 365px;
  }
  .mc-chest-head {
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 800; font-size: 13px; margin-bottom: 8px; color: #222;
  }
  .mc-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; }
  .mc-slot {
    aspect-ratio: 1; background: #8b8b8b; border: 2px solid;
    border-color: #373737 #fff #fff #373737;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer; position: relative; border-radius: 2px;
  }
  .mc-slot:hover { background: #a8a8a8; outline: 2px solid #ffff55; z-index: 2; }
  .mc-slot-num { position: absolute; top: 1px; left: 2px; font-size: 8px; color: #eee; font-weight: 700; }
  .mc-slot-tip {
    display: none; position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
    background: #100010; border: 2px solid #5000ff; color: #fff; padding: 4px 7px;
    border-radius: 4px; font-size: 11px; white-space: nowrap; z-index: 30; pointer-events: none;
  }
  .mc-slot:hover .mc-slot-tip { display: block; }

  .sim-chat {
    background: rgba(0,0,0,0.78); border-radius: 6px; padding: 8px; height: 150px;
    overflow-y: auto; font-family: Consolas, monospace; font-size: 11.5px; display: flex; flex-direction: column; gap: 3px;
  }
  .sim-input-row { display: flex; gap: 6px; padding: 8px; background: #11141a; }
  .sim-input-row input {
    flex: 1; background: #232834; border: 1px solid #384152; color: #fff;
    padding: 6px 10px; border-radius: 5px; font-size: 12px; user-select: text;
  }

  /* MODALS */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(15,23,42,0.58);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal {
    background: #fff; width: 560px; max-width: 94vw; border-radius: 12px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.28); overflow: hidden; display: flex; flex-direction: column;
  }
  .modal-head {
    padding: 14px 18px; background: var(--accent); color: #fff;
    display: flex; justify-content: space-between; align-items: center; font-weight: 800;
  }
  .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 12px; max-height: 76vh; overflow-y: auto; }
  .field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; color: var(--text-muted); }
  .field input, .field textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; user-select: text;
  }
  .card-item {
    border: 1.5px solid var(--border); border-radius: 9px; padding: 11px 13px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .card-item:hover { border-color: var(--accent); background: #f8fbff; }
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; font-weight: 600; z-index: 200; display: none; box-shadow: 0 6px 20px rgba(0,0,0,0.28);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span>🧩 SKrach</span>
    <span class="brand-badge">SKRIPT + GUI</span>
  </div>

  <div class="top-controls">
    <select id="langSwitcher" class="lang-select" onchange="setLanguage(this.value)" title="Language / Język">
      <option value="pl">🇵🇱 Polski</option>
      <option value="en">🇬🇧 English</option>
    </select>
    <input id="projectTitle" class="title-input" value="Sklep GUI BoxPvP" maxlength="60">
    <button class="btn btn-purple" id="btnTemplates" onclick="openTemplatesModal()">📚 Szablony</button>
    <button class="btn btn-orange" id="btnShare" onclick="openShareModal()">🚀 Opublikuj / Udostępnij</button>
    <button class="btn btn-white" id="btnDownload" onclick="downloadSk()">⬇ Pobierz .sk</button>
  </div>
</header>

<main>
  <!-- KATEGORIE -->
  <aside class="categories" id="catList">
    <div class="cat-item active" data-cat="events" onclick="selectCat('events')">
      <div class="cat-dot" style="background:#ffbf00"></div><span id="cat_events">Wydarzenia</span>
    </div>
    <div class="cat-item" data-cat="player" onclick="selectCat('player')">
      <div class="cat-dot" style="background:#4c97ff"></div><span id="cat_player">Gracz</span>
    </div>
    <div class="cat-item" data-cat="gui" onclick="selectCat('gui')">
      <div class="cat-dot" style="background:#9966ff"></div><span id="cat_gui">GUI Skrzynia</span>
    </div>
    <div class="cat-item" data-cat="world" onclick="selectCat('world')">
      <div class="cat-dot" style="background:#59c059"></div><span id="cat_world">Świat</span>
    </div>
    <div class="cat-item" data-cat="ctrl" onclick="selectCat('ctrl')">
      <div class="cat-dot" style="background:#ffab19"></div><span id="cat_ctrl">Kontrola</span>
    </div>
    <div class="cat-item" data-cat="vars" onclick="selectCat('vars')">
      <div class="cat-dot" style="background:#ff8c1a"></div><span id="cat_vars">Zmienne</span>
    </div>
  </aside>

  <!-- PALETA BLOKÓW -->
  <section class="palette" id="palette"></section>

  <!-- OBSZAR ROBOCZY -->
  <section class="workspace-wrap">
    <div class="workspace-bar">
      <span id="targetInfo"></span>
      <div style="display:flex; gap:6px;">
        <button class="btn" id="btnNewStack" style="padding:3px 9px; font-size:11px; background:#fff;" onclick="addNewStack()">+ Nowy stos</button>
        <button class="btn" id="btnClear" style="padding:3px 9px; font-size:11px; background:#fee2e2; color:#b91c1c;" onclick="clearWorkspace()">Wyczyść</button>
      </div>
    </div>
    <div id="workspace"></div>
  </section>

  <!-- PRAWY PANEL: KOD .SK + SYMULATOR -->
  <aside class="right-panel">
    <div class="tabs">
      <div class="tab active" id="tabCode" onclick="switchRightTab('code')">📄 Kod Skript (.sk)</div>
      <div class="tab" id="tabSim" onclick="switchRightTab('sim')">▶ Testuj na żywo + GUI</div>
    </div>

    <div id="codeView" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
      <div class="code-box" id="codeOutput"></div>
      <div class="code-actions">
        <button class="btn btn-green" id="btnCopyCode" style="flex:1; justify-content:center;" onclick="copyCode()">📋 Kopiuj kod .sk</button>
        <button class="btn btn-white" id="btnDownload2" onclick="downloadSk()">💾 Pobierz .sk</button>
      </div>
    </div>

    <div class="sim-box" id="simView">
      <div class="sim-screen">
        <div class="sim-hud">
          <span id="simHpHud">❤️ 20/20</span>
          <span id="simVarsHud">Zmienne: brak</span>
        </div>

        <div class="sim-triggers" id="simTriggersBox"></div>

        <!-- INTERAKTYWNA SKRZYNIA GUI MINECRAFT -->
        <div class="mc-chest-overlay" id="mcChestOverlay">
          <div class="mc-chest">
            <div class="mc-chest-head">
              <span id="mcChestTitle">Chest</span>
              <button class="mini-btn del" id="btnCloseChest" onclick="closeSimChest()">✕ Zamknij</button>
            </div>
            <div class="mc-grid" id="mcChestGrid"></div>
          </div>
        </div>

        <div class="sim-chat" id="simChat"></div>
      </div>
      <div class="sim-input-row">
        <input id="simCmdInput" onkeydown="if(event.key==='Enter') runSimCommand()">
        <button class="btn btn-green" id="btnSimSend" onclick="runSimCommand()">Wyślij</button>
      </div>
    </div>
  </aside>
</main>

<!-- MODAL: SZABLONY -->
<div class="modal-backdrop" id="templatesModal" onclick="if(event.target===this) closeModals()">
  <div class="modal">
    <div class="modal-head">
      <span id="modalTplTitle">📚 Gotowe szablony skryptów Skript</span>
      <button class="mini-btn" onclick="closeModals()">✕</button>
    </div>
    <div class="modal-body" id="templatesList"></div>
  </div>
</div>

<!-- MODAL: ANONIMOWA PUBLIKACJA I ZAPIS LOKALNY (BEZ SQL) -->
<div class="modal-backdrop" id="shareModal" onclick="if(event.target===this) closeModals()">
  <div class="modal">
    <div class="modal-head">
      <span id="modalShareTitle">🚀 Opublikuj anonimowo i udostępnij linkiem</span>
      <button class="mini-btn" onclick="closeModals()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label id="lblPubTitle">Nazwa skryptu</label>
        <input id="pubTitle" maxlength="60">
      </div>
      <div class="field">
        <label id="lblPubAuthor">Twój nick (opcjonalnie, domyślnie Anonim)</label>
        <input id="pubAuthor" placeholder="Anonim" maxlength="32">
      </div>
      <button class="btn btn-green" id="btnPublishDo" style="justify-content:center;" onclick="publishAnonymous()">✨ Zapisz i wygeneruj link udostępniania</button>

      <div id="shareResultBox" style="display:none; background:#f0fdf4; border:1px solid #86efac; padding:10px; border-radius:8px;">
        <div id="lblShareReady" style="font-size:12px; font-weight:700; color:#166534; margin-bottom:5px;">Gotowy link do wysłania:</div>
        <div style="display:flex; gap:6px;">
          <input id="shareUrlInput" readonly style="flex:1; font-size:12px; padding:6px; border:1px solid #bbf7d0; border-radius:5px; user-select:text;">
          <button class="btn btn-green" id="btnCopyLink" onclick="copyShareUrl()">Kopiuj link</button>
        </div>
      </div>

      <div id="lblSavedList" style="font-size:12px; font-weight:800; color:var(--text-muted); margin-top:6px;">📁 Zapisane skrypty w Twojej przeglądarce:</div>
      <div id="savedScriptsList" style="display:flex; flex-direction:column; gap:7px;"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// =========================================================================
// SŁOWNIK TŁUMACZEŃ (PL / EN)
// =========================================================================
let currentLang = localStorage.getItem('skrach_lang') || 'pl';

const I18N = {
  pl: {
    titlePlaceholder: 'Nazwa skryptu...',
    btnTemplates: '📚 Szablony',
    btnShare: '🚀 Opublikuj / Udostępnij',
    btnDownload: '⬇ Pobierz .sk',
    btnDownload2: '💾 Pobierz .sk',
    btnCopyCode: '📋 Kopiuj kod .sk',
    cat_events: 'Wydarzenia',
    cat_player: 'Gracz',
    cat_gui: 'GUI Skrzynia',
    cat_world: 'Świat',
    cat_ctrl: 'Kontrola',
    cat_vars: 'Zmienne',
    paletteTitle: 'Kliknij blok, aby dodać',
    targetInside: 'Cel dodawania: <b>Wnętrze wybranego bloku C</b> (<a href="#" onclick="activeContainerRef=null;renderWorkspace();return false;">wróć na dół stosu</a>)',
    targetStack: (n) => `Cel dodawania: <b>Stos #${n}</b>`,
    btnNewStack: '+ Nowy stos',
    btnClear: 'Wyczyść',
    stackLabel: (n) => `Stos #${n}`,
    btnDelStack: 'Usuń stos',
    emptyStack: 'Pusty stos — wybierz blok z lewej palety',
    insideHint: '+ kliknij tutaj, aby dodawać bloki do środka',
    tabCode: '📄 Kod Skript (.sk)',
    tabSim: '▶ Testuj na żywo + GUI',
    varsEmpty: 'Zmienne: brak',
    varsPrefix: 'Zmienne: ',
    btnCloseChest: '✕ Zamknij',
    simWelcome: '[SKrach] Kliknij przycisk akcji lub wpisz dowolną komendę z Twoich bloków (np. /sklep, /kit)!',
    simCmdPlaceholder: 'Wpisz komendę np. /sklep lub /kit...',
    btnSimSend: 'Wyślij',
    modalTplTitle: '📚 Gotowe szablony skryptów Skript',
    btnLoadTpl: 'Wczytaj',
    modalShareTitle: '🚀 Opublikuj anonimowo i udostępnij linkiem (Bez SQL)',
    lblPubTitle: 'Nazwa skryptu',
    lblPubAuthor: 'Twój nick (opcjonalnie, domyślnie Anonim)',
    anonDefault: 'Anonim',
    btnPublishDo: '✨ Zapisz i wygeneruj link udostępniania',
    lblShareReady: 'Gotowy link do wysłania na Discorda (działa bez bazy SQL!):',
    btnCopyLink: 'Kopiuj link',
    lblSavedList: '📁 Zapisane skrypty w Twojej przeglądarce:',
    noSaved: 'Brak zapisanych skryptów. Kliknij przycisk wyżej, aby zapisać pierwszy!',
    btnOpen: 'Otwórz',
    authorLabel: 'Autor',

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.display = 'none', 2800);
}

function selectCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-item').forEach(el => el.classList.toggle('active', el.dataset.cat === cat));
  renderPalette();
}

function renderPalette() {
  const pal = document.getElementById('palette');
  pal.innerHTML = `<div class="palette-title">${t('paletteTitle')}</div>`;
  BLOCK_DEFS[currentCat].forEach(def => {
    const el = document.createElement('div');
    el.className = `block c-${def.cat} ${def.hat ? 'hat' : ''}`;
    const row = document.createElement('div');
    row.className = 'block-row';
    def.label.forEach(part => {
      if (typeof part === 'string') {
        const s = document.createElement('span');
        s.textContent = part;
        row.appendChild(s);
      } else {
        const badge = document.createElement('span');
        badge.style.cssText = 'background:#fff;color:#1f2933;padding:1px 7px;border-radius:99px;font-size:11px;';
        badge.textContent = part.v;
        row.appendChild(badge);
      }
    });
    el.appendChild(row);
    el.onclick = () => addBlockFromDef(def);
    pal.appendChild(el);
  });
}

function addBlockFromDef(def) {
  const newBlock = { type: def.type };
  def.label.forEach(p => { if (typeof p === 'object') newBlock[p.k] = p.v; });
  if (def.cBlock) newBlock.children = [];

  if (def.hat) {
    stacks.push([newBlock]);
    selectedStackIdx = stacks.length - 1;
    activeContainerRef = newBlock.children;
  } else {
    if (!stacks.length) stacks.push([]);
    if (activeContainerRef) {
      activeContainerRef.push(newBlock);
    } else {
      stacks[selectedStackIdx].push(newBlock);
    }
    if (def.cBlock) activeContainerRef = newBlock.children;
  }
  renderWorkspace();
}

function addNewStack() {
  stacks.push([]);
  selectedStackIdx = stacks.length - 1;
  activeContainerRef = null;
  renderWorkspace();
}

function clearWorkspace() {
  stacks = [[]];
  selectedStackIdx = 0;
  activeContainerRef = null;
  renderWorkspace();
  showToast(t('toastCleared'));
}

function renderBlockNode(block, parentArray, idx) {
  const def = ALL_DEFS[block.type];
  if (!def) return document.createTextNode('');
  const el = document.createElement('div');
  el.className = `block c-${def.cat} ${def.hat ? 'hat' : ''}`;

  const row = document.createElement('div');
  row.className = 'block-row';

  def.label.forEach(part => {
    if (typeof part === 'string') {
      const span = document.createElement('span');
      span.textContent = part;
      row.appendChild(span);
    } else {
      const inp = document.createElement('input');
      inp.value = block[part.k] ?? part.v;
      if (part.num) inp.className = 'num';
      if (part.wide) inp.className = 'wide';
      inp.onclick = e => e.stopPropagation();
      inp.oninput = e => {
        block[part.k] = e.target.value;
        updateCodeOutput();
        refreshSimTriggers();
      };
      row.appendChild(inp);
    }
  });

  const delBtn = document.createElement('button');
  delBtn.textContent = '✕';
  delBtn.style.cssText = 'margin-left:auto;background:rgba(0,0,0,0.22);border:none;color:#fff;border-radius:4px;padding:1px 5px;cursor:pointer;font-size:10px;';
  delBtn.onclick = e => {
    e.stopPropagation();
    if (activeContainerRef === block.children) activeContainerRef = null;
    parentArray.splice(idx, 1);
    renderWorkspace();
  };
  row.appendChild(delBtn);
  el.appendChild(row);

  if (def.cBlock) {
    const inner = document.createElement('div');
    inner.className = 'c-inner' + (activeContainerRef === block.children ? ' active-target' : '');
    inner.onclick = e => {
      e.stopPropagation();
      activeContainerRef = block.children;
      renderWorkspace();
    };
    if (!block.children || block.children.length === 0) {
      const hint = document.createElement('span');
      hint.style.cssText = 'font-size:11px;opacity:0.75;';
      hint.textContent = t('insideHint');
      inner.appendChild(hint);
    } else {
      block.children.forEach((child, cIdx) => {
        inner.appendChild(renderBlockNode(child, block.children, cIdx));
      });
    }
    el.appendChild(inner);
    const foot = document.createElement('div');
    foot.className = 'c-footer';
    foot.textContent = 'end';
    el.appendChild(foot);
  }
  return el;
}

function renderWorkspace() {
  const ws = document.getElementById('workspace');
  ws.innerHTML = '';
  document.getElementById('targetInfo').innerHTML = activeContainerRef
    ? t('targetInside')
    : t('targetStack', selectedStackIdx + 1);

  stacks.forEach((stack, sIdx) => {
    const grp = document.createElement('div');
    grp.className = 'stack-group' + (sIdx === selectedStackIdx ? ' selected' : '');
    grp.onclick = () => {
      selectedStackIdx = sIdx;
      activeContainerRef = null;
      renderWorkspace();
    };

    const head = document.createElement('div');
    head.className = 'stack-header';
    head.innerHTML = `<span>${t('stackLabel', sIdx + 1)}</span>`;
    const delStack = document.createElement('button');
    delStack.className = 'mini-btn del';
    delStack.textContent = t('btnDelStack');
    delStack.onclick = e => {
      e.stopPropagation();
      stacks.splice(sIdx, 1);
      if (!stacks.length) stacks.push([]);
      selectedStackIdx = 0;
      activeContainerRef = null;
      renderWorkspace();
    };
    head.appendChild(delStack);
    grp.appendChild(head);

    if (!stack.length) {
      const empty = document.createElement('div');
      empty.style.cssText = 'font-size:12px;color:#64748b;padding:12px;';
      empty.textContent = t('emptyStack');
      grp.appendChild(empty);
    } else {
      stack.forEach((blk, bIdx) => grp.appendChild(renderBlockNode(blk, stack, bIdx)));
    }
    ws.appendChild(grp);
  });

  updateCodeOutput();
  refreshSimTriggers();
}

// =========================================================================
// GENERATOR KODU .SK
// =========================================================================
function compileBlocks(list, indentLevel) {
  const ind = '\t'.repeat(indentLevel);
  return list.map(b => {
    const def = ALL_DEFS[b.type];
    if (!def) return '';
    if (def.cBlock) {
      const innerIndent = b.type === 'cmd' ? indentLevel + 2 : indentLevel + 1;
      const bodyCode = compileBlocks(b.children || [], innerIndent);
      return def.toSk(b, ind, bodyCode);
    }
    return def.toSk(b, ind);
  }).filter(Boolean).join('\n');
}

function generateFullSkript() {
  const title = document.getElementById('projectTitle').value || 'Script';
  const header = `# ==========================================\n# Generated with SKrach (Scratch for Skript)\n# Project: ${title}\n# ==========================================\n\n`;
  const body = stacks.map(st => compileBlocks(st, 0)).filter(Boolean).join('\n\n');
  return header + (body || '# Add blocks on the left to generate Skript code!');
}

function updateCodeOutput() {
  document.getElementById('codeOutput').textContent = generateFullSkript();
}

function copyCode() {
  navigator.clipboard.writeText(generateFullSkript());
  showToast(t('toastCopiedCode'));
}

function downloadSk() {
  const title = (document.getElementById('projectTitle').value || 'script').toLowerCase().replace(/[^a-z0-9_-]/g, '_');
  const filename = `${title || 'script'}.sk`;
  const blob = new Blob([generateFullSkript()], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  showToast(t('toastDownloaded', filename));
}

// =========================================================================
// INTERAKTYWNY SYMULATOR MINECRAFT + SKRZYNIA GUI NA ŻYWO (PEŁNE WYKONANIE)
// =========================================================================
const simState = {
  vars: { 'kasa.Gracz': 150 },
  chestOpen: false,
  chestTitle: '',
  chestRows: 3,
  chestItems: {},
  lastClickedSlot: -1
};

const ITEM_ICONS = {
  diamond: '💎', emerald: '💚', 'netherite sword': '🗡️', 'iron sword': '⚔️',
  'cooked beef': '🥩', gold: '🪙', stone: '🪨', apple: '🍎', barrier: '⛔'
};

function getItemIcon(name) {
  const low = String(name || '').toLowerCase();
  for (const [k, icon] of Object.entries(ITEM_ICONS)) {
    if (low.includes(k)) return icon;
  }
  return '📦';
}

function formatMcColors(str) {
  const map = { '0':'#000','1':'#00a','2':'#0a0','3':'#0aa','4':'#a00','5':'#a0a','6':'#fa0','7':'#aaa','8':'#777','9':'#55f','a':'#5f5','b':'#5ff','c':'#f55','d':'#f5f','e':'#ff5','f':'#fff' };
  let color = '#ffffff';
  let html = '';
  const txt = String(str).replace(/%player%/g, 'Gracz');
  for (let i = 0; i < txt.length; i++) {
    if (txt[i] === '&' && map[txt[i+1]?.toLowerCase()]) {
      color = map[txt[i+1].toLowerCase()];
      i++;
    } else if (txt[i] === '&' && (txt[i+1] === 'l' || txt[i+1] === 'r')) {
      i++;
    } else {
      html += `<span style="color:${color}">${txt[i].replace(/</g,'&lt;')}</span>`;
    }
  }
  return html;
}

function logSim(msg) {
  const chat = document.getElementById('simChat');
  const line = document.createElement('div');
  line.innerHTML = formatMcColors(msg);
  chat.appendChild(line);
  chat.scrollTop = chat.scrollHeight;
}

function updateVarsHud() {
  const entries = Object.entries(simState.vars).map(([k, v]) => `{${k}}: ${v}`);
  document.getElementById('simVarsHud').textContent = entries.length ? t('varsPrefix') + entries.join(' | ') : t('varsEmpty');
}

function resolveVarName(raw) {
  return String(raw || '').replace(/%player%/g, 'Gracz');
}

// Dynamicznie buduje przyciski wyzwalaczy na podstawie aktywnych bloków użytkownika!
function refreshSimTriggers() {
  const box = document.getElementById('simTriggersBox');
  if (!box) return;
  box.innerHTML = '';

  const addedKeys = new Set();
  const addTriggerBtn = (key, label, cls, fn) => {
    if (addedKeys.has(key)) return;
    addedKeys.add(key);
    const btn = document.createElement('button');
    btn.className = `btn ${cls}`;
    btn.textContent = label;
    btn.onclick = fn;
    box.appendChild(btn);
  };

  stacks.forEach(st => {
    const hat = st[0];
    if (!hat) return;
    if (hat.type === 'on_join') {
      addTriggerBtn('join', t('simJoinBtn'), 'btn-orange', () => runSimEvent('join'));
    } else if (hat.type === 'on_break') {
      const blk = (hat.block || 'stone').trim();
      addTriggerBtn('break_' + blk, t('simBreakBtn', blk), 'btn-green', () => runSimEvent('break', blk));
    } else if (hat.type === 'on_right_click') {
      addTriggerBtn('rclick', t('simClickBtn'), 'btn-white', () => runSimEvent('right_click'));
    } else if (hat.type === 'cmd') {
      const cmd = (hat.name || 'sklep').trim();
      addTriggerBtn('cmd_' + cmd, `/${cmd}`, 'btn-purple', () => runSimCommand('/' + cmd));
    }
  });

  if (addedKeys.size === 0) {
    addTriggerBtn('join', t('simJoinBtn'), 'btn-orange', () => runSimEvent('join'));
  }
}

function renderSimChest() {
  const overlay = document.getElementById('mcChestOverlay');
  if (!simState.chestOpen) {
    overlay.style.display = 'none';
    return;
  }
  overlay.style.display = 'flex';
  document.getElementById('mcChestTitle').innerHTML = formatMcColors(simState.chestTitle);
  const grid = document.getElementById('mcChestGrid');
  grid.innerHTML = '';
  const total = Math.min(54, Math.max(9, simState.chestRows * 9));
  for (let s = 0; s < total; s++) {
    const slotEl = document.createElement('div');
    slotEl.className = 'mc-slot';
    slotEl.innerHTML = `<span class="mc-slot-num">${s}</span>`;
    const it = simState.chestItems[s];
    if (it) {
      slotEl.innerHTML += `<span>${getItemIcon(it.item)}</span><div class="mc-slot-tip">${formatMcColors(it.name)}</div>`;
    }
    slotEl.onclick = () => {
      simState.lastClickedSlot = s;
      logSim(t('simGuiClick', s));
      executeEventType('on_inv_click');
    };
    grid.appendChild(slotEl);
  }
}

function closeSimChest() {
  simState.chestOpen = false;
  renderSimChest();
}

// Asynchroniczne wykonanie listy bloków (wspiera wait X seconds i stop!)
async function executeList(list) {
  for (const b of list) {
    if (b.type === 'stop') return 'STOP';
    if (b.type === 'cancel') continue;

    if (b.type === 'wait') {
      const sec = Math.min(10, Math.max(0.1, parseFloat(b.sec) || 1));
      logSim(t('simWait', sec));
      await new Promise(r => setTimeout(r, sec * 1000));
    }
    else if (b.type === 'send') logSim(b.msg);
    else if (b.type === 'broadcast') logSim(`&e[BC] ${b.msg}`);
    else if (b.type === 'actionbar') logSim(`&d[ActionBar] ${b.msg}`);
    else if (b.type === 'give') logSim(t('simGiven', b.amount, b.item));
    else if (b.type === 'drop_item') logSim(t('simDrop', b.amount, b.item));
    else if (b.type === 'sound') logSim(t('simSound', b.snd));
    else if (b.type === 'heal') logSim(t('simHealed'));
    else if (b.type === 'strike_lightning') logSim(t('simLightning'));
    else if (b.type === 'set_time') logSim(t('simTime', b.time));
    else if (b.type === 'open_gui') {
      simState.chestOpen = true;
      simState.chestRows = parseInt(b.rows, 10) || 3;
      simState.chestTitle = b.title || 'Chest';
      simState.chestItems = {};
      renderSimChest();
    }
    else if (b.type === 'format_slot') {
      simState.chestItems[parseInt(b.slot, 10) || 0] = { item: b.item, name: b.name };
      renderSimChest();
    }
    else if (b.type === 'close_gui') closeSimChest();
    else if (b.type === 'if_inv_name') {
      if (simState.chestTitle === b.title) {
        const res = await executeList(b.children || []);
        if (res === 'STOP') return 'STOP';
      }
    }
    else if (b.type === 'if_slot') {
      if (simState.lastClickedSlot === (parseInt(b.slot, 10) || 0)) {
        const res = await executeList(b.children || []);
        if (res === 'STOP') return 'STOP';
      }
    }
    else if (b.type === 'chance') {
      const pct = parseFloat(b.pct) || 0;
      if (Math.random() * 100 <= pct) {
        const res = await executeList(b.children || []);
        if (res === 'STOP') return 'STOP';
      }
    }
    else if (b.type === 'var_set') {
      simState.vars[resolveVarName(b.vname)] = Number(b.val) || 0;
      updateVarsHud();
    }
    else if (b.type === 'var_add') {
      const k = resolveVarName(b.vname);
      simState.vars[k] = (Number(simState.vars[k]) || 0) + (Number(b.val) || 0);
      updateVarsHud();
    }
    else if (b.type === 'var_remove') {
      const k = resolveVarName(b.vname);
      simState.vars[k] = (Number(simState.vars[k]) || 0) - (Number(b.val) || 0);
      updateVarsHud();
    }
    else if (b.type === 'if_var') {
      const k = resolveVarName(b.vname);
      const cur = Number(simState.vars[k]) || 0;
      const req = Number(b.val) || 0;
      if (cur >= req) {
        const res = await executeList(b.children || []);
        if (res === 'STOP') return 'STOP';
      } else {
        logSim(t('simCondFail', k, cur, req));
      }
    }
  }
}

function executeEventType(type, extraMatch) {
  stacks.forEach(st => {
    const hat = st[0];
    if (!hat || hat.type !== type) return;
    if (extraMatch && !extraMatch(hat)) return;
    const sequence = [...(hat.children || []), ...st.slice(1)];
    executeList(sequence);
  });
}

function runSimEvent(ev, param) {
  if (ev === 'join') {
    logSim(t('simJoinedLog'));
    executeEventType('on_join');
  } else if (ev === 'break') {
    const targetBlk = (param || 'stone').toLowerCase();
    logSim(t('simBrokeLog', targetBlk));
    executeEventType('on_break', h => (h.block || '').toLowerCase() === targetBlk);
  } else if (ev === 'right_click') {
    logSim(t('simClickLog'));
    executeEventType('on_right_click');
  }
}

function runSimCommand(overrideCmd) {
  const inp = document.getElementById('simCmdInput');
  const raw = (overrideCmd || inp.value || '').trim();
  if (!raw) return;
  if (!overrideCmd) inp.value = '';
  const cmdName = raw.replace(/^\//, '').split(' ')[0].toLowerCase();
  logSim(`&8> &f/${cmdName}`);
  let found = false;
  stacks.forEach(st => {
    const hat = st[0];
    if (hat && hat.type === 'cmd' && (hat.name || '').toLowerCase() === cmdName) {
      found = true;
      const sequence = [...(hat.children || []), ...st.slice(1)];
      executeList(sequence);
    }
  });
  if (!found) logSim(t('simUnknownCmd', cmdName));
}

function switchRightTab(tab) {
  document.getElementById('tabCode').classList.toggle('active', tab === 'code');
  document.getElementById('tabSim').classList.toggle('active', tab === 'sim');
  document.getElementById('codeView').style.display = tab === 'code' ? 'flex' : 'none';
  document.getElementById('simView').style.display = tab === 'sim' ? 'flex' : 'none';
  refreshSimTriggers();
  updateVarsHud();
}

// =========================================================================
// SZABLONY ORAZ ANONIMOWE UDOSTĘPNIANIE BEZ SQL (URL HASH + LOCALSTORAGE)
// =========================================================================
function openTemplatesModal() {
  const box = document.getElementById('templatesList');
  box.innerHTML = '';
  TEMPLATES.forEach(tpl => {
    const titleStr = tpl.name[currentLang] || tpl.name.pl;
    const descStr = tpl.desc[currentLang] || tpl.desc.pl;
    const card = document.createElement('div');
    card.className = 'card-item';
    card.innerHTML = `<div><div style="font-weight:800;font-size:13.5px;">${titleStr}</div><div style="font-size:12px;color:#627d98;margin-top:2px;">${descStr}</div></div>`;
    const btn = document.createElement('button');
    btn.className = 'btn btn-purple';
    btn.textContent = t('btnLoadTpl');
    btn.onclick = () => {
      stacks = JSON.parse(JSON.stringify(tpl.stacks));
      selectedStackIdx = 0;
      activeContainerRef = null;
      document.getElementById('projectTitle').value = titleStr.replace(/^[^\wąćęłńóśźżĄĆĘŁŃÓŚŹŻ]+\s*/, '');
      renderWorkspace();
      closeModals();
      showToast(t('toastTplLoaded'));
    };
    card.appendChild(btn);
    box.appendChild(card);
  });
  document.getElementById('templatesModal').style.display = 'flex';
}

function encodeProjectToHash(payload) {
  const json = JSON.stringify(payload);
  return btoa(encodeURIComponent(json));
}

function decodeProjectFromHash(hashStr) {
  try {
    return JSON.parse(decodeURIComponent(atob(hashStr)));
  } catch { return null; }
}

function openShareModal() {
  document.getElementById('pubTitle').value = document.getElementById('projectTitle').value || 'Script';
  document.getElementById('shareResultBox').style.display = 'none';
  renderSavedScriptsList();
  document.getElementById('shareModal').style.display = 'flex';
}

function publishAnonymous() {
  const title = (document.getElementById('pubTitle').value || '').trim() || 'Untitled';
  const author = (document.getElementById('pubAuthor').value || '').trim() || t('anonDefault');
  document.getElementById('projectTitle').value = title;

  const payload = { t: title, a: author, s: stacks, d: new Date().toLocaleDateString(currentLang === 'pl' ? 'pl-PL' : 'en-US') };
  const encoded = encodeProjectToHash(payload);
  const url = `${location.origin}${location.pathname}#s=${encoded}`;
  history.replaceState(null, '', `#s=${encoded}`);

  const list = JSON.parse(localStorage.getItem('skrach_scripts_v1') || '[]');
  list.unshift({ title, author, date: payload.d, hash: encoded });
  localStorage.setItem('skrach_scripts_v1', JSON.stringify(list.slice(0, 30)));

  document.getElementById('shareUrlInput').value = url;
  document.getElementById('shareResultBox').style.display = 'block';
  renderSavedScriptsList();
  showToast(t('toastPublished'));
}

function copyShareUrl() {
  const inp = document.getElementById('shareUrlInput');
  inp.select();
  navigator.clipboard.writeText(inp.value);
  showToast(t('toastCopiedLink'));
}

function renderSavedScriptsList() {
  const box = document.getElementById('savedScriptsList');
  const list = JSON.parse(localStorage.getItem('skrach_scripts_v1') || '[]');
  box.innerHTML = list.length ? '' : `<div style="font-size:12px;color:#94a3b8;">${t('noSaved')}</div>`;
  list.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'card-item';
    row.innerHTML = `<div><div style="font-weight:700;font-size:13px;">${item.title}</div><div style="font-size:11px;color:#627d98;">${t('authorLabel')}: <b>${item.author}</b> • ${item.date}</div></div>`;
    const actions = document.createElement('div');
    actions.style.display = 'flex';
    actions.style.gap = '5px';

    const openBtn = document.createElement('button');
    openBtn.className = 'btn btn-white';
    openBtn.style.border = '1px solid #cbd5e1';
    openBtn.textContent = t('btnOpen');
    openBtn.onclick = () => {
      const data = decodeProjectFromHash(item.hash);
      if (data && data.s) {
        stacks = data.s;
        document.getElementById('projectTitle').value = data.t || item.title;
        selectedStackIdx = 0;
        activeContainerRef = null;
        renderWorkspace();
        closeModals();
        showToast(t('toastLoaded', item.title));
      }
    };

    const delBtn = document.createElement('button');
    delBtn.className = 'mini-btn del';
    delBtn.textContent = '✕';
    delBtn.onclick = () => {
      list.splice(idx, 1);
      localStorage.setItem('skrach_scripts_v1', JSON.stringify(list));
      renderSavedScriptsList();
    };

    actions.append(openBtn, delBtn);
    row.appendChild(actions);
    box.appendChild(row);
  });
}

function closeModals() {
  document.querySelectorAll('.modal-backdrop').forEach(m => m.style.display = 'none');
}

// =========================================================================
// START APLIKACJI + ODCZYT PROJEKTU Z LINKU (#s=...)
// =========================================================================
window.addEventListener('DOMContentLoaded', () => {
  if (location.hash.startsWith('#s=')) {
    const shared = decodeProjectFromHash(location.hash.slice(3));
    if (shared && Array.isArray(shared.s)) {
      stacks = shared.s;
      document.getElementById('projectTitle').value = shared.t || 'Shared script';
      showToast(`${shared.t} (${shared.a || t('anonDefault')})`);
    }
  }
  setLanguage(currentLang);
  document.getElementById('simChat').innerHTML = `<div style="color:#94a3b8;">${t('simWelcome')}</div>`;
});
